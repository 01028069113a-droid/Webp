<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>11월25일 저녁 신청 받기</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #f87171;
      --success: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.28);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e2e8f0;
    }

    .required {
      color: var(--accent);
      margin-left: 2px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      background: #0f172a;
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
      line-height: 1.5;
    }

    .error-msg {
      color: var(--danger);
      font-size: 13px;
      margin-top: 8px;
      min-height: 18px;
    }

    .btn-submit {
      width: 100%;
      margin-top: 8px;
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #082f49;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--accent-hover);
      color: #ffffff;
    }

    .btn-submit:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .complete-box {
      display: none;
      text-align: center;
      padding: 24px 8px;
    }

    .complete-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
    }

    .complete-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }

    .complete-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="formView">
      <span class="badge">11월 25일 저녁</span>
      <h1>11월25일 저녁 신청 받기</h1>
      <p class="subtitle">이름과 원하는 음식, 하고 싶은 말을 입력한 뒤 확인 버튼을 눌러주세요.</p>

      <form id="menuForm" novalidate>
        <div class="form-group">
          <label for="name">이름<span class="required">*</span></label>
          <input type="text" id="name" name="name" placeholder="예: 김능인" autocomplete="name" required />
        </div>

        <div class="form-group">
          <label for="food">음식<span class="required">*</span></label>
          <input type="text" id="food" name="food" placeholder="예: 돈까스, 마라탕, 칼국수 등" required />
        </div>

        <div class="form-group">
          <label for="message">하고 싶은 말</label>
          <textarea id="message" name="message" placeholder="남기고 싶은 메모나 요청사항을 적어주세요."></textarea>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <button type="submit" id="submitBtn" class="btn-submit">확인</button>
      </form>
    </div>

    <div id="completeView" class="complete-box">
      <div class="complete-icon">✓</div>
      <div id="completeText" class="complete-title">답장 감사합니다.</div>
      <p class="complete-desc">신청이 완료되었습니다. 창을 닫아주세요.</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('menuForm');
    const nameInput = document.getElementById('name');
    const foodInput = document.getElementById('food');
    const messageInput = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const formView = document.getElementById('formView');
    const completeView = document.getElementById('completeView');
    const completeText = document.getElementById('completeText');

    function closeOrEndWebApp() {
      try {
        window.close();
      } catch (e) {}

      // 브라우저 보안 정책으로 window.close()가 차단된 경우 입력 폼을 제거하고 종료 화면만 유지
      setTimeout(() => {
        formView.remove();
        completeView.style.display = 'block';
      }, 250);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorMsg.textContent = '';

      const name = nameInput.value.trim();
      const food = foodInput.value.trim();
      const message = messageInput.value.trim();

      if (!name) {
        errorMsg.textContent = '이름을 입력해 주세요.';
        nameInput.focus();
        return;
      }

      if (!food) {
        errorMsg.textContent = '음식을 입력해 주세요.';
        foodInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '전송 중...';

      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success) {
            completeText.textContent = res.message || '답장 감사합니다.';
            formView.style.display = 'none';
            completeView.style.display = 'block';
            closeOrEndWebApp();
          } else {
            errorMsg.textContent = (res && res.message) || '제출에 실패했습니다.';
            submitBtn.disabled = false;
            submitBtn.textContent = '확인';
          }
        })
        .withFailureHandler(function (err) {
          errorMsg.textContent = '오류가 발생했습니다: ' + (err && err.message ? err.message : '알 수 없는 오류');
          submitBtn.disabled = false;
          submitBtn.textContent = '확인';
        })
        .submitApplication({
          name: name,
          food: food,
          message: message
        });
    });
  </script>
</body>
</html>
