[실습문제] 
1. 다음과 같은 웹 페이지가 있다. 이 웹 페이지가 로드될 때, '접속 감사합니다!'라는 문장을 담은 
200×80 크기의 새 윈도우를 별도로 출력하도록 웹 페이지를 수정하라.
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>HTML5</title></head>
<body>
<h3>HTML5</h3>
<hr>
<p>
HTML5를 학습하는 사이트입니다.
여기서 HTML5, CSS3, 자바스크립트를
배울 수 있습니다.</p>
</body></html>

정답:
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>HTML5</title>
    <script>
        function welcome() {
            let win = window.open("", "", "width=200,height=80");
            win.document.write("접속 감사합니다!");
            win.document.close(); // 문서 출력 스트림 닫기
        }
    </script>
</head>
<body onload="welcome()">
    <h3>HTML5</h3>
    <hr>
    <p>
        HTML5를 학습하는 사이트입니다.
        여기서 HTML5, CSS3, 자바스크립트를
        배울 수 있습니다.
    </p>
</body>
</html>
