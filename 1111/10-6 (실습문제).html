6. setInterval()과 clearInterval()을 이용하여 `<div>` 태그에 시계를 구현하라. 
시계 위를 클릭하면 시계가 멈추고 클릭하면 현재 시각부터 시계가 다시 가도록 하라.

정답:

html
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>div 태그에 시계 만들기</title>
    <script>
        let timerId = null;

        function startClock() {
            // 최초 실행 및 1초 간격 반복 설정
            if(timerId == null) {
                updateTime();
                timerId = setInterval(updateTime, 1000);
            }
        }

        function updateTime() {
            let now = new Date();
            let timeStr = now.toLocaleTimeString();
            document.getElementById("myClock").innerHTML = timeStr;
        }

        function controlClock() {
            if (timerId != null) {
                // 이미 실행 중이면 멈춤 (Clear)
                clearInterval(timerId);
                timerId = null;
            } else {
                // 멈춰있는 상태면 다시 시작
                startClock();
            }
        }
    </script>
</head>
<body onload="startClock()">
    <h3>div 태그에 시계 만들기</h3>
    <p>시계를 클릭하면 시계가 멈추고 다시 클릭하면 가기 시작한다.</p>
    <hr>
    <!-- 시계가 출력되는 div 영역을 클릭했을 때 controlClock 함수 실행 -->
    <div id="myClock" onclick="controlClock()" style="font-size:20px; color:brown; cursor:pointer;"></div>
</body>
</html>
