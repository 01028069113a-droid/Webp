5. setTimeout()과 clearTimeout()을 이용하여 `<div>` 태그에 시계를 구현하라. 
  웹 페이지가 로드되면 즉각 현재 시각에서부터 시계가 가기 시작한다. 현재 시각 값은 new Date()로 얻으면 된다.

정답:
  
html
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>div 태그에 시계 만들기</title>
    <script>
        let timerId = null;

        function startClock() {
            printClock();
        }

        function printClock() {
            let now = new Date();
            let timeStr = now.toLocaleTimeString(); // "오후 3:57:20" 형태 추출
            let div = document.getElementById("myClock");
            div.innerHTML = timeStr;

            // 1초(1000밀리초) 후에 자기 자신을 다시 호출하여 시계 갱신
            timerId = setTimeout(printClock, 1000);
        }
    </script>
</head>
<body onload="startClock()">
    <h3>div 태그에 시계 만들기</h3>
    <hr>
    <div id="myClock" style="font-size:20px; color:brown;"></div>
</body>
</html>
