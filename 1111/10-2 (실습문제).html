2. 문제 1의 코드를 수정하여 보자.

(1) 새 윈도우가 스크린 장치를 기준으로 (500, 400)에 출력되게 하라.
(2) 새 윈도우의 타이틀을 '환영'으로, 바탕색을 yellowgreen으로 출력되도록 하라.

정답:
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>HTML5</title>
    <script>
        function welcome() {
            // (1) 스크린 기준 위치(left=500, top=400)와 크기 지정
            let win = window.open("", "", "width=200,height=80,left=500,top=400");
            
            // (2) write()가 실행된 이후에 타이틀 및 바탕색 설정
            win.document.write("접속 감사합니다!<br>열심히 하세요!");
            win.document.title = "환영";
            win.document.body.style.backgroundColor = "yellowgreen";
            win.document.close();
        }
    </script>
</head>
<body onload="welcome()">
    <h3>HTML5</h3>
    <hr>
    <p>
        HTML5를 학습하는 사이트입니다.<br>
        여기서 HTML5, CSS3, 자바스크립트를 배울 수 있습니다.
    </p>
</body>
</html>
