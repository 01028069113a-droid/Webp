9. 스크린의 해상도가 1280×1024보다 작은 경우, 웹 페이지가 로드되자마자 "스크린 해상도가 낮습니다!"라고 경고 창을 출력하는 
웹 페이지를 작성하라.

정답 :

html
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>screen 객체 활용</title>
    <script>
        function checkScreen() {
            // screen.width와 screen.height를 이용해 해상도 체크
            if (screen.width < 1280 || screen.height < 1024) {
                alert("스크린 해상도가 낮습니다!");
            }
        }
    </script>
</head>
<body onload="checkScreen()">
    <h3>screen 객체 활용</h3>
    <hr>
    <p>스크린의 해상도가 1280x1024보다 작은 경우 웹 페이지가 정상적으로 출력되지 않을 수 있음을 알리고 경고창을 출력한다.</p>
</body>
</html>
