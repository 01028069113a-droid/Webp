3. 옵션을 선택하면 옵션에 주어진 사이트에 접속하는 웹 페이지를 작성하고자 한다.

(1) 옵션을 선택될 때마다 새 윈도우를 하나씩 열고 사이트를 접속하는 웹 페이지를 작성하라.
정답 코드:
html
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>사이트 접속</title>
    <script>
        function openSite(sel) {
            let url = sel.value;
            window.open(url, "", "width=500,height=400");
        }
    </script>
</head>
<body>
    <h3>옵션 선택으로 사이트 접속</h3>
    <p>옵션 선택 마다 새 윈도우에 접속합니다.</p>
    <hr>
    <form>
        <label>접속할 사이트</label><br>
        <select onchange="openSite(this)">
            <option value="">--선택--</option>
            <option value="https://www.naver.com">네이버</option>
            <option value="https://www.google.co.kr">구글</option>
            <option value="https://www.oracle.com">오라클</option>
        </select>
    </form>
</body>
</html>


(2) 새 윈도우는 한 개만 열고, 옵션 선택 시 이 윈도우를 공유하도록 웹 페이지를 작성하라.
정답 코드:
```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>사이트 접속</title>
    <script>
        let win = null; // 창 객체를 저장할 전역 변수

        function openSite(sel) {
            let url = sel.value;
            if(url == "") return;

            // 창이 열려있지 않거나 닫혀있으면 새로 생성 ("myWin" 이라는 이름 지정)
            if (win == null || win.closed) {
                win = window.open(url, "myWin", "width=500,height=400");
            } else {
                // 이미 열려있는 창이 있다면 주소만 이동시키고 포커스 부여
                win.location.href = url;
                win.focus();
            }
        }
    </script>
</head>
<body>
    <h3>옵션 선택으로 사이트 접속</h3>
    <p>옵션 선택 시 이 윈도우를 공유합니다.</p>
    <hr>
    <form>
        <label>접속할 사이트</label><br>
        <select onchange="openSite(this)">
            <option value="">--선택--</option>
            <option value="https://www.naver.com">네이버</option>
            <option value="https://www.google.co.kr">구글</option>
            <option value="https://www.oracle.com">오라클</option>
        </select>
    </form>
</body>
</html>
