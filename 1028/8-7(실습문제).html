문제 7
이미지를 마우스로 클릭하면 이미지를 90도 회전시키는 웹 페이지를 작성하라.

(1) 클릭하면 한 번만 90도 회전하기
정답:

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>transform rotate</title>
</head>
<body>
<h3>클릭하면 90도 회전합니다.</h3>
<hr>
<img src="media/spongebob.png" width="150" height="150" alt="스폰지밥" onclick="this.style.transform='rotate(90deg)';">
</body>
</html>

(2) 클릭할 때마다 90도씩 계속 회전하기
정답:

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>transform rotate()</title>
<script>
    let angle = 0;
    function rotateImg(obj) {
        angle += 90;
        obj.style.transform = "rotate(" + angle + "deg)";
    }
</script>
</head>
<body>
<h3>클릭하면 90도 회전합니다.</h3>
<hr>
<img src="media/spongebob.png" width="150" height="150" alt="스폰지밥" onclick="rotateImg(this);">
</body>
</html>
