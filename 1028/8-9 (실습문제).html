문제 9

이전 페이지(하단)에 제시된 HTML 페이지와 출력 결과(yellowgreen 색으로 칠해진 <ol> 영역)에서, 
이 영역에 마우스를 클릭하면 다음과 같이 prompt() 함수를 출력하고, 
사용자로부터 입력받은 문자열로 라면을 끓이는 순서를 하나씩 삽입하는 자바스크립트 코드를 삽입하라.

정답:
 <ol type="A" style="background-color:yellowgreen" onclick="let text = prompt('라면을 끓이는 순서를 입력하라'); if(text){ let li = document.createElement('li'); li.innerHTML = text; this.appendChild(li); }">
    <li>물을 끓인다.</li>
</ol>
