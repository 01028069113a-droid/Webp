문제 4
다음과 같이 계산식이 출력되고 '답'을 클릭하면 계산 결과를 출력하는 웹 페이지를 작성하고자 한다. HTML 소스의 빈칸을 채우고 HTML 페이지를 완성하라.

...
<p>2 + 4 = <span onclick="this.__________________ =eval(2+4)">답</span></p>
<p>4 * 20 + 64 = <span onclick="this.__________________ =eval(4*20+64)">답</span></p>
<p>20/5-8*2 = <span onclick="this.__________________ =20/5-8*2">답</span></p>
...

정답:
<p>2 + 4 = <span onclick="this.innerHTML=eval(2+4)">답</span></p>
<p>4 * 20 + 64 = <span onclick="this.innerHTML=eval(4*20+64)">답</span></p>
<p>20/5-8*2 = <span onclick="this.innerHTML=20/5-8*2">답</span></p>
