6. 이미지 위에 마우스 휠을 위로 굴리면 이미지가 5%씩 축소되고 아래로 굴리면 5%씩 확대되는 웹 페이지를 작성하라.


정답:

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>onwheel</title>
<script>
function wheel(e, img) {
    // e.wheelDelta(이전 방식) 또는 e.deltaY(표준) 이용
    // e.deltaY < 0 이면 휠을 위로 굴림(축소), e.deltaY > 0 이면 휠을 아래로 굴림(확대)
    if (e.deltaY < 0) {
        img.width -= img.width * 0.05;
        img.height -= img.height * 0.05;
    } else {
        img.width += img.width * 0.05;
        img.height += img.height * 0.05;
    }
}
</script>
</head>
<body>
<h3>마우스 휠을 이용한 이미지 확대/축소</h3>
<hr>
<p>
이미지 위에 휠을 위로 굴리면 이미지가 축소되고 아래로 굴리면 이미지가 확대됩니다.
</p>
<img src="media/tulips.jpg" width="200" height="150" onwheel="wheel(event, this)">
</body>
</html>
