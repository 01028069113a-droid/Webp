8. 다음 웹 페이지에서 <li> 아이템을 클릭하면 텍스트 크기를 1.3배(1.3em)로 출력하도록 자바스크립트 코드를 작성하라.
  다른 아이템이 클릭되면 이전 아이템을 원래 크기로(1em) 출력한다.

정답:

HTML
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>이벤트 객체의 target</title>
<script>
let selectedItem = null; // 이전에 선택된 li 객체 저장

window.onload = function() {
    let list = document.getElementsByTagName("li");
    for(let i=0; i<list.length; i++) {
        list[i].onclick = function(e) {
            if(selectedItem != null) {
                selectedItem.style.fontSize = "1em"; // 이전 아이템 원래 크기로
            }
            let item = e.target;
            item.style.fontSize = "1.3em"; // 클릭된 아이템 1.3배 크기로
            selectedItem = item;
        }
    }
}
</script>
</head>
<body>
<h3>아이템을 클릭하면 1.3배 크기로</h3>
<hr>
<p>여름 방학 때 하고 싶은 것들</p>
<ul>
    <li>자전거로 대한민국 일주</li>
    <li>책 100권 읽기</li>
    <li>철인 3종 경기 준비</li>
    <li>자바스크립트 정복</li>
</ul>
</body>
</html>
