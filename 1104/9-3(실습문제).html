3. 계산식을 입력받아 결과를 출력하는 웹 페이지를 작성하라. 식 입력 후 <Enter> 키를 치면 수식을 계산하고 결과를 출력한다.

정답:

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>onkeydown</title>
<script>
function calculate(e) {
    if (e.key === "Enter") {
        let exp = document.getElementById("exp");
        let result = document.getElementById("result");
        try {
            result.value = eval(exp.value);
        } catch(err) {
            alert("잘못된 수식입니다.");
        }
    }
}
</script>
</head>
<body>
<h3>계산기 만들기</h3>
<hr>
<p>수식을 입력하고 &lt;Enter&gt;를 입력하세요.</p>
<form>
    식 <input type="text" id="exp" onkeydown="calculate(event)"><br>
    값 <input type="text" id="result">
</form>
</body>
</html>
