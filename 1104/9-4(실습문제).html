4. onmousemove를 이용하여 웹 페이지에 마우스가 움직일 때 이미지를 마우스 커서처럼 사용하도록 웹 페이지를 작성하라. 이미지는 가로 30픽셀, 세로 30픽셀 크기로 하라.

정답:
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>onmousemove</title>
<style>
#imgDiv {
    position: absolute;
    width: 30px;
    height: 30px;
    pointer-events: none; /* 마우스 이벤트를 방해하지 않도록 설정 */
}
</style>
<script>
document.onmousemove = function(e) {
    let div = document.getElementById("imgDiv");
    div.style.left = e.clientX + "px";
    div.style.top = e.clientY + "px";
}
</script>
</head>
<body>
<h3>이미지 커서 만들기</h3>
<hr>
<p>마우스를 움직이면 이미지로 만든 커서가 마우스를 따라 다닙니다</p>
<div id="imgDiv">
    <img src="media/spongebob.png" width="30" height="30" alt="커서 이미지">
</div>
</body>
</html>
