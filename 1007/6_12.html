12. 다음 웹 페이지가 출력되는 모양을 그려라.

(왼쪽 코드)
HTML
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>1</title>
</head>
<body>
<script>
    document.write("Welcome");
</script>
</body>
</html>


풀이 과정:
 웹 브라우저 타이틀 바에는 `<title>1</title>`에 의해 **`1`**이 표시됩니다.
  * 본문(body) 스크립트 실행에 의해 화면에는 **`Welcome`**이라는 텍스트가 출력됩니다.

정답 (출력 모양):
 브라우저 탭/타이틀: `1`
 화면 출력**:
    ```text
    Welcome
