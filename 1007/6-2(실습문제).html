2. document.write()를 이용하여 다음 <script> 태그 안에 자바스크립트 코드를 완성하라.

[제시된 문제 코드]
HTML
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>document.write()</title>
</head>
<body>
<script>
    // 이곳에 자바스크립트 코드를 작성하라.
</script>
</body>
</html>


풀이 과정
  * 오른쪽 출력 결과 화면을 보면 **`Welcome Home`**이 큰 제목(h3) 형태로 출력되어 있고, 그 아래 **`저희 홈 페이지 오신 것을 환영합니다.`** 텍스트가 표시되어 있습니다.
  * `document.write()`를 사용하여 HTML 태그(`<h3>`, `<p>` 등)를 포함한 문자열을 직접 출력하도록 코드를 작성합니다.

정답 코드

```html
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>document.write()</title>
</head>
<body>
<script>
    document.write("<h3>Welcome Home</h3>");
    document.write("<hr>");
    document.write("<p>저희 홈 페이지 오신 것을 환영합니다.</p>");
</script>
</body>
</html>
