6. 
6번 문제[문제 내용]prompt() 함수를 호츨하여 사용자로부터 문자열을 입력받고 "&" 문자를 기준으로 분할하여 출력하는 웹 페이지를 작성하라.  

 [풀이 과정]
prompt() 함수를 이용해 문자열을 입력받습니다.   String 객체의 split("&") 함수를 사용하여 입력받은 문자열을 & 기호를 기준으로 쪼개어 배열로 반환받습니다.   
반복문을 이용해 분할된 배열의 각 요소들을 화면에 출력합니다.

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>문자열 분할</title>
</head>
<body>
<h3>문자열 분할</h3>
<hr>
<script>
let s = prompt("문자열 입력");
let sub = s.split("&");

for(let i=0; i<sub.length; i++) {
    document.write(sub[i] + "<br>");
}
</script>
</body>
</html>
